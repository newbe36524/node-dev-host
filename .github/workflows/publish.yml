name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * 1" # weekly rebuild to pick up base-image security updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/newbe36524/node-dev-host
  # Every published tag must carry all of these; the verify steps below fail the job otherwise.
  # The control dashboard is built once per target on the builder's platform, and its static output is
  # copied into each platform's image, so the UI check below runs for every platform in this list.
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: host
            tag: latest
            suffix: ""
          - target: demo
            tag: demo
            suffix: "-demo"
          - target: host-alpine
            tag: alpine
            suffix: "-alpine"
          - target: demo-alpine
            tag: demo-alpine
            suffix: "-demo-alpine"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          tags="$IMAGE:${{ matrix.tag }}"
          # a v1.2.3 git tag also publishes 1.2.3, 1.2.3-demo, 1.2.3-alpine and 1.2.3-demo-alpine
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}${{ matrix.suffix }}"
            tags="$tags,$IMAGE:$v"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          # zstd layers are about 24% smaller to pull than gzip (measured on the host image).
          # Clients that cannot read zstd layers cannot pull these tags; check the target Docker version.
          outputs: type=registry,compression=zstd,compression-level=19,force-compression=true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Verify every platform was published
        run: |
          out=$(docker buildx imagetools inspect "$IMAGE:${{ matrix.tag }}")
          echo "$out" | grep 'Platform:'
          missing=0
          for p in ${PLATFORMS//,/ }; do
            if ! grep -Eq "Platform: +${p}\$" <<<"$out"; then
              echo "::error::$IMAGE:${{ matrix.tag }} is missing $p"
              missing=1
            fi
          done
          exit "$missing"
      - name: Verify the control dashboard is in every platform
        # Runs the published image for each platform and fails if the dashboard's entry file is absent.
        run: |
          for p in ${PLATFORMS//,/ }; do
            echo "checking $p"
            docker run --rm --platform "$p" --entrypoint sh "$IMAGE:${{ matrix.tag }}" \
              -c 'test -f /usr/local/lib/dev-host/control/ui/index.html' \
              || { echo "::error::$IMAGE:${{ matrix.tag }} ($p) has no control dashboard"; exit 1; }
          done
