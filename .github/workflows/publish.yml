name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * 1" # weekly rebuild to pick up base-image security updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/newbe36524/node-dev-host

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: host
            tag: latest
          - target: demo
            tag: demo
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          tags="$IMAGE:${{ matrix.tag }}"
          # a v1.2.3 git tag also publishes 1.2.3 (host) / 1.2.3-demo (demo)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
            [ "${{ matrix.target }}" = demo ] && v="$v-demo"
            tags="$tags,$IMAGE:$v"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
